name: Build Physics Quest APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhysicsQuest_AndroidStudio_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack Android project
        run: |
          unzip -q PhysicsQuest_AndroidStudio_Project.zip -d source
          test -f source/PhysicsQuestAndroid/settings.gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: source/PhysicsQuestAndroid
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Physics-Quest-APK
          path: source/PhysicsQuestAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
